services:
  mlflow:
    image: python:3.11-slim
    command: >
      bash -c "
        pip install mlflow==2.9.0 &&
        mlflow server 
        --host 0.0.0.0 
        --port 5000 
        --backend-store-uri sqlite:///mlflow/mlflow.db 
        --default-artifact-root /mlflow/mlartifacts
      "
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - mlops-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G



  llm-connector:
    image: mlops-llm-connector:latest
    ports:
      - "8001:8001"
    environment:
      - LLM_PROVIDER=ollama
      - LLM_MODEL=llama2
      - LLM_API_URL=http://host.docker.internal:11434
      - LOG_LEVEL=INFO
    networks:
      - mlops-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1'
          memory: 1G
      update_config:
        parallelism: 1
        delay: 10s



  sklearn-model:
    image: mlops-sklearn-model:latest
    ports:
      - "8002:8002"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - LOG_LEVEL=INFO
    volumes:
      - sklearn-models:/app/models
    networks:
      - mlops-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1'
          memory: 2G



  cnn-image:
    image: mlops-cnn-image:latest
    ports:
      - "8003:8003"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - LOG_LEVEL=INFO
      - TF_CPP_MIN_LOG_LEVEL=2
    volumes:
      - cnn-models:/app/models
    networks:
      - mlops-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '2'
          memory: 4G



  gradio-frontend:
    image: mlops-gradio-frontend:latest
    ports:
      - "7860:7860"
    environment:
      - LLM_SERVICE_URL=http://llm-connector:8001
      - SKLEARN_SERVICE_URL=http://sklearn-model:8002
      - CNN_SERVICE_URL=http://cnn-image:8003
    networks:
      - mlops-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1'
          memory: 2G


networks:
  mlops-network:
    driver: overlay

volumes:
  mlflow-data:
    name: mlops-mlflow-data
  sklearn-models:
    name: mlops-sklearn-models
  cnn-models:
    name: mlops-cnn-models