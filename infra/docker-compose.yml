services:

  ollama:
    image: ollama/ollama:latest
    container_name: mlops-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - mlops-network
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=0.0.0.0
    entrypoint: >
      bash -c "
        ollama serve &
        sleep 5
        ollama pull llama2
        wait -n  
      "
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G


  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    container_name: mlops-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - mlops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  llm-connector:
    build:
      context: ../llm_connector
      dockerfile: Dockerfile
    container_name: mlops-llm-connector
    ports:
      - "8001:8001"
    environment:
      - LLM_PROVIDER=ollama
      - LLM_MODEL=llama2
      - LLM_API_URL=http://ollama:11434
      - LOG_LEVEL=INFO
    networks:
      - mlops-network
    depends_on:
      ollama:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


  sklearn-model:
    build:
      context: ../sklearn_model
      dockerfile: Dockerfile
    container_name: mlops-sklearn-model
    ports:
      - "8002:8002"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - LOG_LEVEL=INFO
    volumes:
      - sklearn-models:/app/models
    networks:
      - mlops-network
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


  
  cnn-image:
    build:
      context: ../cnn_image
      dockerfile: Dockerfile
    container_name: mlops-cnn-image
    ports:
      - "8003:8003"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - LOG_LEVEL=INFO
      - TF_CPP_MIN_LOG_LEVEL=2
    volumes:
      - cnn-image-models:/app/models
    networks:
      - mlops-network
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    
  gradio-frontend:
    build:
      context: ../gradio_frontend
      dockerfile: Dockerfile
    container_name: mlops-gradio-frontend
    ports:
      - "7860:7860"
    environment:
      - LLM_CONNECTOR_URL=http://llm-connector:8001
      - SKLEARN_MODEL_URL=http://sklearn-model:8002
      - CNN_IMAGE_URL=http://cnn-image:8003
    networks:
      - mlops-network
    depends_on:
      - llm-connector
      - sklearn-model
      - cnn-image
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


networks:
  mlops-network:
    driver: bridge
    name: mlops-network


volumes:
  ollama-data:
    name: mlops-ollama-data
  mlflow-data:
    name: mlops-mlflow-data
  sklearn-models:
    name: mlops-sklearn-models
  cnn-image-models:
    name: mlops-cnn-models